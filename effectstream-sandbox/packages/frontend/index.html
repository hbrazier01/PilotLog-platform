<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PilotLog — Profile Foundation</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <div class="container">
        <h1>PilotLog</h1>

        <h2>Wallet</h2>
        <div id="address">Not connected</div>
        <div id="signer-info" style="font-size:0.85em; color:#666;"></div>
        <button id="login" onclick="walletConnect()">Connect 1AM Wallet</button>

        <h2>Create Profile</h2>
        <input id="display-name" type="text" placeholder="Display Name" />
        <input id="pilot-phase" type="text" placeholder="Pilot Phase (e.g. student, ppl, cfi)" />
        <input id="notes" type="text" placeholder="Notes (optional)" />
        <button onclick="createProfile()">Create Profile</button>
        <div id="tx-result"></div>

        <hr />
        <h2>Profiles (GET /api/profiles)</h2>
        <button onclick="fetchProfiles()">Refresh</button>
        <div id="profiles-display"></div>
    </div>
</body>

<script type="module" src="./min.js"></script>

<script>
    async function fetchProfiles() {
        const response = await fetch("http://localhost:9999/api/profiles");
        const data = await response.json();
        const container = document.getElementById("profiles-display");
        if (!data.profiles || data.profiles.length === 0) {
            container.innerHTML = "<p>No profiles yet.</p>";
            return;
        }
        container.innerHTML = data.profiles.map(p => `
            <div style="border:1px solid #ccc; padding:8px; margin:8px 0; border-radius:4px;">
                <strong>${p.display_name}</strong> — ${p.pilot_phase}<br/>
                <small>Signer: ${p.signer_address}</small><br/>
                ${p.notes ? `<em>${p.notes}</em>` : ""}
            </div>
        `).join("");
    }

    async function walletConnect() {
        const wallet = await effectstream.login();
        document.getElementById("address").innerText = "Midnight addr: " + wallet.address;
        document.getElementById("signer-info").innerText =
            wallet.signerAddress ? ("batcher EVM key: " + wallet.signerAddress) : "";
    }

    async function createProfile() {
        const displayName = document.getElementById("display-name").value || "Anonymous";
        const pilotPhase = document.getElementById("pilot-phase").value || "student";
        const notes = document.getElementById("notes").value || "";
        document.getElementById("tx-result").innerText = "Submitting...";
        try {
            const result = await effectstream.sendCreateProfile(displayName, pilotPhase, notes);
            console.log("[tx-debug]", result);
            document.getElementById("tx-result").innerText = "Profile created! " + JSON.stringify(result, null, 2);
            await fetchProfiles();
        } catch (err) {
            document.getElementById("tx-result").innerText = "Error: " + err.message;
            console.error(err);
        }
    }
</script>

</html>
